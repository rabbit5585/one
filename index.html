<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獵人執照試驗場</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hunter: {
              bg: '#0a0d14',
              card: '#141a29',
              border: '#2a3650',
              accent: '#ffcc00',
              neon: '#00ffcc',
              red: '#ff2a5f',
              purple: '#a855f7'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0a0d14;
      color: #f3f4f6;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 255, 204, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(255, 204, 0, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .hunter-title-glow {
      text-shadow: 0 0 15px rgba(255, 204, 0, 0.6), 0 0 30px rgba(255, 204, 0, 0.2);
    }
    .card-hunter-style {
      background: linear-gradient(135deg, #182232 0%, #0d131f 100%);
      border: 2px solid #3b4d6c;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.15);
    }
    .btn-hunter {
      background: linear-gradient(90deg, #ffcc00 0%, #ff9900 100%);
      color: #000;
      font-weight: 900;
      transition: all 0.2s ease;
    }
    .btn-hunter:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.8);
    }
    .nen-aura-active {
      animation: nenAuraPulse 2s infinite alternate;
    }
    @keyframes nenAuraPulse {
      0% { box-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }
      100% { box-shadow: 0 0 25px rgba(0, 255, 204, 0.8); }
    }
  </style>
</head>
<body>
  <div class="card-hunter-style p-8 rounded-2xl max-w-md w-full text-center border-hunter-border">
    <h1 class="text-3xl font-black text-hunter-accent mb-2 hunter-title-glow tracking-widest">HUNTER EXAM</h1>
    <p class="text-gray-400 text-sm mb-6">第 287 期獵人試驗修煉場</p>
    
    <div class="bg-[#0a0d14] p-5 rounded-xl border border-gray-800 mb-6 nen-aura-active">
      <div class="text-gray-400 text-xs mb-1">念能力修煉值 (REN)</div>
      <div id="power-display" class="text-4xl font-black text-hunter-neon tracking-wider">100</div>
    </div>

    <button onclick="train()" class="btn-hunter w-full py-4 rounded-xl text-lg mb-3 cursor-pointer">
      ⚡ 釋放念能力修煉
    </button>
  </div>

  <script>
    let power = 100;
    function train() {
      power += 50;
      document.getElementById('power-display').innerText = power;
    }
  </script>
</body>
</html>
